[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = 
	adafruit/DHT sensor library@^1.4.7
	mike-matera/ArduinoSTL@^1.3.3
	;silver-fang/Cpp_Standard_Library@^3.5.2
